[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ingest"
version = "0.1.0"
description = "A lean ML/AI ingest pipeline with batched LLM ranking and multi-provider model support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "feedparser>=6.0.11,<7",
  "httpx>=0.27.0,<1",
  "litellm>=1.67.0,<2",
  "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9",
]

[project.scripts]
ai-ingest = "ai_ingest.main:main"

[tool.setuptools.packages.find]
include = ["ai_ingest*"]

[tool.pytest.ini_options]
addopts = ["-s"]
testpaths = ["tests"]
